name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Check firmware
        run: cargo check --locked

  macos-bridge:
    name: macOS Bridge
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bridge
        run: swift build --package-path macos-bridge

  linux-bridge:
    name: Linux Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check bridge
        run: |
          python3 -m py_compile linux-bridge/m5wispr_bridge.py
          python3 linux-bridge/test_protocol.py

  windows-bridge:
    name: Windows Bridge
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test bridge
        run: dotnet run --project windows-bridge -c Release -- --self-test
